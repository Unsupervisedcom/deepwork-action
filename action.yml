name: 'DeepWork Review Action'
description: 'Run DeepWork reviews via Claude Code on a PR, auto-commit improvements, and add inline PR review comments'
author: 'Unsupervisedcom'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude Code'
    required: true
  github_token:
    description: 'GitHub token with write access to commit changes and post review comments'
    required: true
  model:
    description: 'Claude model to use (e.g. claude-sonnet-4-6, claude-opus-4-6)'
    required: false
    default: 'claude-opus-4-6'
  max_turns:
    description: 'Maximum number of agentic turns for Claude Code. DeepWork /review dispatches parallel sub-agents per rule so each reviewer eats a turn budget; 100 is comfortable for repos with a handful of rules, raise for larger rule suites.'
    required: false
    default: '100'
  commit_message:
    description: 'Commit message for auto-committed review changes'
    required: false
    default: 'chore: apply DeepWork review suggestions'

runs:
  using: 'composite'
  steps:
    - name: Restore DeepWork review cache
      uses: actions/cache@v4
      with:
        path: .deepwork/tmp
        # A unique save key per run ensures the cache is always updated with the
        # latest review state after each run. restore-keys picks up the most recent
        # cache for this PR so already-passed reviews are not re-run.
        key: deepwork-review-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        restore-keys: |
          deepwork-review-pr-${{ github.event.pull_request.number }}-

    - name: Load review prompt
      id: load_prompt
      shell: bash
      run: |
        {
          echo 'content<<EOF_DEEPWORK_PROMPT'
          cat "${{ github.action_path }}/prompts/review.txt"
          echo EOF_DEEPWORK_PROMPT
        } >> "$GITHUB_OUTPUT"

    - name: Run DeepWork Review
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        plugin_marketplaces: https://github.com/Unsupervisedcom/deepwork.git
        plugins: deepwork@deepwork-plugins
        track_progress: true
        use_commit_signing: false
        bot_name: 'deepwork-action[bot]'
        # Debug aids while we iterate on getting inline comments working.
        # show_full_output exposes Claude SDK tool calls in the runner log
        # (including secrets — only safe in trusted repos).
        # classify_inline_comments=false posts every inline comment Claude
        # creates instead of buffering them and classifying real-vs-probe.
        show_full_output: true
        classify_inline_comments: false
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}
          COMMIT MESSAGE FOR AUTO-FIXES: ${{ inputs.commit_message }}

          ${{ steps.load_prompt.outputs.content }}
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max_turns }}
          --dangerously-skip-permissions
